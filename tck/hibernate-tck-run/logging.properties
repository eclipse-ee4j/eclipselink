#
# Console logging for the standalone Persistence TCK run.
#
# The TCK logs through java.lang.System.Logger (PMClientBase uses
# System.getLogger). No System.LoggerFinder is on the classpath, so the JDK
# falls back to java.util.logging, and the System.Logger levels map onto
# java.util.logging levels like this:
#
#     System.Logger.Level     java.util.logging.Level
#     --------------------    -----------------------
#     ERROR                   SEVERE
#     WARNING                 WARNING
#     INFO                    INFO
#     DEBUG                   FINE
#     TRACE                   FINER
#     ALL                     ALL
#
# So TRACE calls only appear once both the logger and the handler are at FINER
# or lower. Enable with:
#
#     mvn clean install -Djava.util.logging.config.file=logging.properties
#
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Handler has to be at least as verbose as the most verbose logger below.
java.util.logging.ConsoleHandler.level = FINER

# Everything else stays at INFO so the TCK's own output is not buried.
.level = INFO

# The TCK's own classes, including PMClientBase.displayMap.
ee.jakarta.tck.level = FINER
