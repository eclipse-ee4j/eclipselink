#JEE GlassFish
#Server family (value is specified by cargo-maven3-plugin).
server.name=glassfish

#Server type/major version (value is specified by cargo-maven3-plugin).
server.containerId=glassfish9x

#Hostname to which server binds. Used by testing client (EJB client) too.
server.host=localhost

#Server HTTP port. Web console is usually available there.
server.http.port=8080

#IIOP listener port, which is what a remote EJB client connects to. Not 4848 - that is the asadmin
#port, and it is not a naming port.
server.rmi.port=3700

#RMI protocol. Used by EJB client.
server.rmi.protocol=iiop

#Username used by testing client for authentication. Usually it's default server username.
server.usr=admin

#Password used by testing client for authentication. Usually it's default server password.
server.pwd=adminadmin

#JEE/EJB client initial context factory (driver). gf-client also carries a jndi.properties declaring
#this same factory, so a client on that classpath does not strictly need it.
server.initialCtxFactory=com.sun.enterprise.naming.SerialInitContextFactory

#EclipseLink specific property/hint to identify server family. The value has to be exactly
#"Glassfish": eclipselink-testbuild-plugin maps it to the glassfish-platform sessions.xml type.
server.platform=Glassfish
server.platform.class=glassfish-platform

#JEE server client library. The version comes from the glassfish.version property, so it is not
#repeated here. Note gf-client-module, not gf-client: the latter is only the app client container
#launcher, while gf-client-module pulls the naming and IIOP stack a remote EJB client needs.
jee.client.groupId=org.glassfish.main.appclient
jee.client.artifactId=gf-client-module

#Server binaries location.
#GlassFish is not downloaded from a URL: the distribution is resolved from the Maven repository and
#unpacked by the glassfish profile of jpa/eclipselink.jpa.testapps, so the URL-based installation
#that WildFly uses is switched off here. Without this the build would download the WildFly zip named
#by the default installation.url.
skip.jee.server.installation=true
#cargo.container.installation.home=/usr/local/javaApplications/glassfish9
cargo.container.installation.home=${user.home}/.eclipselinktests/glassfish9

#Part of the JNDI name (suffix) of the testing EJBs deployed to the server, looked up under
#server.testrunner.context. GlassFish uses the bean#interface form.
server.testrunner.suffix=TestRunner#org.eclipse.persistence.testing.framework.jpa.server.TestRunner
server.testrunner1.suffix=TestRunner1#org.eclipse.persistence.testing.framework.jpa.server.TestRunner1
server.testrunner2.suffix=TestRunner2#org.eclipse.persistence.testing.framework.jpa.server.TestRunner2
server.testrunner3.suffix=TestRunner3#org.eclipse.persistence.testing.framework.jpa.server.TestRunner3
server.testrunner4.suffix=TestRunner4#org.eclipse.persistence.testing.framework.jpa.server.TestRunner4
server.testrunner5.suffix=TestRunner5#org.eclipse.persistence.testing.framework.jpa.server.TestRunner5
server.testrunner6.suffix=TestRunner6#org.eclipse.persistence.testing.framework.jpa.server.TestRunner6
